name: Mobile CI
on:
  pull_request:
  push:
    branches: [develop]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.5
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
      - name: Secret scan
        run: >-
          docker run --rm -v "${PWD}:/repo" zricethezav/gitleaks:v8.28.0
          detect --source=/repo --no-banner --redact --exit-code=1
